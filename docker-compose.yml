version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: foodies_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=foodies
    volumes:
      - mongodb_data:/data/db

  # 2. Spring Boot REST API Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodies_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/foodies
      - JWT_SECRET=ThisIsMyVerySecureJWTSecretKeyForFoodDeliveryApplication123456789
      - CORS_ALLOWED_ORIGINS=*
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=abhishek7y4@gmail.com
      - SMTP_PASSWORD=PLEASE_ENTER_YOUR_16_CHAR_APP_PASSWORD_HERE
    depends_on:
      - mongodb

  # 3. Customer Web Application (React + Vite)
  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile
    container_name: foodies_frontend_customer
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 4. Admin Control Panel (React + Vite)
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: foodies_frontend_admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
