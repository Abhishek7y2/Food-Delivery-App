spring.application.name=foodiesapi

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/foodies

# AWS S3 configuration
aws.access.key=${AWS_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY:YOUR_AWS_SECRET_KEY}
aws.region=ap-south-1
#//aws.s3.bucketname=foodies-foods
aws.s3.bucketname=foodies-foods-992382401576-ap-south-1-an

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port
server.port=8080
jwt.secret.key=${JWT_SECRET:MySuperSecretJwtKeyForFoodiesApplication2026SecureKey123456}

#razorpay configuration
razorpay.key=${RAZORPAY_KEY:YOUR_RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET:YOUR_RAZORPAY_SECRET}

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_EMAIL@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true