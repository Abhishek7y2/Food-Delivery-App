#
spring.application.name=foodiesapi

# ==========================================
# MongoDB
# ==========================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodies}

# ==========================================
# AWS S3
# ==========================================
aws.access.key=${AWS_ACCESS_KEY:none}
aws.secret.key=${AWS_SECRET_KEY:none}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucketname=${AWS_BUCKET_NAME:none}

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Server
# =========================================
server.port=8080

# ==========================================
# JWT
# ==========================================
jwt.secret.key=${JWT_SECRET:ThisIsMyVerySecureJWTSecretKeyForFoodDeliveryApplication123456789}

# ==========================================
# Razorpay
# ==========================================
razorpay.key=${RAZORPAY_KEY:your_razorpay_key_here}
razorpay.secret=${RAZORPAY_SECRET:your_razorpay_secret_here}



# ─── Ollama AI Configuration ───────────────────
# Gemini API
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}

# ==========================================
# Email / SMTP Configuration
# ==========================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:abhishek7y4@gmail.com}
spring.mail.password=${SMTP_PASSWORD:@Abhi2419}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true